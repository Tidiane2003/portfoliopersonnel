<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080A12">
<title>CyberArt — Démo · Cheikh Tidiane Mbow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23080A12'/%3E%3Ctext x='50' y='66' font-size='48' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%2365D8E8'%3ECM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080A12;--card:#0E1220;--card2:#131830;--line:rgba(169,149,255,.22);--paper:#f3ecff;--muted:#9fa6c4;--cyan:#65D8E8;--violet:#a995ff;--orange:#ff941f;--ok:#7ee8a2;--bad:#ff6b6b;--mono:'DM Mono',ui-monospace,monospace;--sans:'Manrope',system-ui,sans-serif;--display:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--paper);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px max(20px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));background:rgba(8,10,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font:11px var(--mono);letter-spacing:.08em}
.top .l,.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top a{text-decoration:none;color:var(--cyan)}
.badge{color:var(--orange);border:1px solid rgba(255,148,31,.45);padding:4px 8px}
.pill,.btn{font:11px var(--mono);letter-spacing:.08em;background:none;border:1px solid var(--line);padding:9px 12px;cursor:pointer;color:var(--cyan);transition:.2s}
.pill:hover,.btn:hover{border-color:var(--cyan);background:rgba(101,216,232,.08)}.btn.p{background:var(--cyan);color:#06121a;border-color:var(--cyan);font-weight:500}.btn.p:hover{filter:brightness(1.1)}.btn.d{color:var(--bad);border-color:rgba(255,107,107,.4)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.03em}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);padding:20px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
input,select,textarea{background:#0a0e1a;border:1px solid var(--line);padding:10px 12px;width:100%}
label{display:block;font:11px var(--mono);letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

h1{font-size:clamp(30px,6vw,56px)}h1 em{font-style:normal;color:var(--cyan)}.sub{color:var(--muted);margin:8px 0 22px;max-width:700px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs .pill.on{background:var(--violet);border-color:var(--violet);color:#0b0720}
.lab{display:none}.lab.on{display:block}.lab h2{font-size:24px;margin-bottom:6px}.lab p.i{color:var(--muted);margin:0 0 16px;max-width:720px}
.out{font:12px/1.6 var(--mono);background:#060913;border:1px solid var(--line);padding:12px;word-break:break-all;min-height:44px;margin-top:8px}.out .df{color:var(--orange);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.g2{grid-template-columns:1fr}}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fb{margin-top:10px;font:12px var(--mono)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:14px 0}.pad button{height:54px;font:600 18px var(--mono);background:var(--card);border:1px solid var(--line);cursor:pointer}.pad button:hover{border-color:var(--cyan)}.dots{text-align:center;font:28px var(--mono);letter-spacing:.4em;min-height:40px}
.step{padding:12px 14px;border:1px solid var(--line);margin-bottom:8px;opacity:.45;transition:.3s}.step.on{opacity:1;border-color:var(--cyan);background:rgba(101,216,232,.06)}.step b{color:var(--cyan)}
.badge2{font:10px var(--mono);color:var(--orange)}

</style></head><body>
<header class="top"><div class="l"><a href="../index.html#projects" data-en="← Back to portfolio">← Retour au portfolio</a><span class="badge" data-en="DEMO · FICTITIOUS DATA">DÉMO · DONNÉES FICTIVES</span></div><div class="r"><span class="muted">CyberArt · Labs</span><button class="pill" id="lang" type="button" aria-label="Switch language / Changer de langue">EN</button></div></header>
<main class="wrap"><h1>Cyber<em>Art</em></h1>
<p class="sub" data-en="Interactive cybersecurity learning platform (8 modules). This preview lets you try 6 hands-on labs, all running in your browser with the Web Crypto API.">Plateforme interactive d’apprentissage de la cybersécurité (8 modules). Cet aperçu permet d’essayer 6 laboratoires pratiques, qui s’exécutent dans votre navigateur avec la Web Crypto API.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="lab card" id="l0"></section><section class="lab card" id="l1"></section><section class="lab card" id="l2"></section><section class="lab card" id="l3"></section><section class="lab card" id="l4"></section><section class="lab card" id="l5"></section></main>
<script>
let lang='fr';try{const q=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('lang');lang=(q==='en'||q==='fr')?q:(s==='en'||s==='fr')?s:'fr'}catch(e){}
const t=(f,e)=>lang==='en'?e:f;
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>{if(e.dataset.fr===undefined)e.dataset.fr=e.innerHTML;e.innerHTML=lang==='en'?e.dataset.en:e.dataset.fr});document.querySelectorAll('[data-en-ph]').forEach(e=>{if(!e.dataset.frPh)e.dataset.frPh=e.placeholder;e.placeholder=lang==='en'?e.dataset.enPh:e.dataset.frPh});document.getElementById('lang').textContent=lang==='en'?'FR':'EN';document.title=document.title.replace(/ — Démo.*| — Demo.*/,lang==='en'?' — Demo · Cheikh Tidiane Mbow':' — Démo · Cheikh Tidiane Mbow');if(typeof render==='function')render()}
document.getElementById('lang').onclick=()=>{lang=lang==='fr'?'en':'fr';try{localStorage.setItem('lang',lang)}catch(e){}applyLang()};

const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur=+(sessionStorage.getItem?.('cl')||0);
const NAMES=()=>[t('1 · Triade CIA','1 · CIA triad'),t('2 · Authentification','2 · Authentication'),t('3 · Hachage','3 · Hashing'),t('4 · AES','4 · AES'),t('5 · RSA','5 · RSA'),t('6 · HTTPS/TLS','6 · HTTPS/TLS')];
function tabs(){$('tabs').innerHTML=NAMES().map((n,i)=>`<button class="pill ${i===cur?'on':''}" role="tab" data-i="${i}">${n}</button>`).join('');$('tabs').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;cur=+i;try{sessionStorage.setItem('cl',cur)}catch(x){}show()}}
function show(){tabs();document.querySelectorAll('.lab').forEach((l,i)=>l.classList.toggle('on',i===cur))}
/* 1 CIA */
const SC=[['Un employé lit un dossier RH sans autorisation.','An employee reads an HR file without permission.',0],['Une facture est modifiée pendant son envoi.','An invoice is altered in transit.',1],['Un site est saturé par une attaque DDoS.','A website is overwhelmed by a DDoS attack.',2],['Un mot de passe fuite dans un dépôt public.','A password leaks in a public repository.',0],['Une sauvegarde corrompue est restaurée sans vérification.','A corrupted backup is restored without checking.',1]];
let ci=0,cs=0,done=false;
function lab0(){const L=[t('Confidentialité','Confidentiality'),t('Intégrité','Integrity'),t('Disponibilité','Availability')];const s=SC[ci];
 $('l0').innerHTML=`<h2>${t('Triade CIA','CIA triad')}</h2><p class="i">${t('Quel pilier de la sécurité est menacé dans chaque scénario ?','Which security pillar is threatened in each scenario?')}</p>`+(done?`<p class="fb ok">${t('Score','Score')} : ${cs}/${SC.length}</p><button class="btn p" id="cr">${t('Rejouer','Play again')}</button>`:`<p><b>${ci+1}/${SC.length}</b> — ${t(s[0],s[1])}</p><div class="opt">${L.map((l,i)=>`<button class="btn" data-a="${i}">${l}</button>`).join('')}</div><p class="fb" id="cf"></p>`);
 $('l0').onclick=e=>{if(e.target.id==='cr'){ci=cs=0;done=false;return lab0()}const a=e.target.dataset.a;if(a===undefined||e.target.disabled)return;const ok=+a===s[2];if(ok)cs++;$('cf').innerHTML=ok?`<span class="ok">✓ ${t('Exact','Correct')}</span>`:`<span class="bad">✗ ${t('C’est','It is')} ${L[s[2]]}</span>`;document.querySelectorAll('#l0 [data-a]').forEach(b=>b.disabled=true);setTimeout(()=>{ci++;if(ci>=SC.length)done=true;lab0()},1100)}}
/* 2 PIN */
let pin='',tries=0,locks=0,lockEnd=0,PINH='',log=[];
const lockSec=k=>Math.min(5*2**(k-1),300);
async function lab1(){if(!PINH)PINH=await sha('demo-salt:2580');
 $('l1').innerHTML=`<h2>${t('Authentification : code PIN protégé','Authentication: protected PIN')}</h2><p class="i">${t('Le code (stocké haché avec un sel) est à 4 chiffres. Après 3 erreurs, le blocage double à chaque fois. Indice de démo : 2580.','The 4-digit PIN is stored salted and hashed. After 3 wrong tries, the lockout doubles each time. Demo hint: 2580.')}</p><div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'C',0,'⏎'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><p class="fb" id="pf" style="text-align:center"></p>
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" id="bf">${t('Simuler une attaque par force brute','Simulate a brute-force attack')}</button><div class="out" id="bo"></div>`;
 const dots=()=>$('dots').textContent='●'.repeat(pin.length)+'○'.repeat(4-pin.length);dots();
 $('l1').onclick=async e=>{const k=e.target.dataset.k;if(e.target.id==='bf'){let s=0,n=0,g=0;for(let i=0;i<10000;i++){g++;if(g===3){n++;s+=lockSec(n);g=0}}const f=x=>x<3600?Math.round(x/60)+' min':x<172800?(x/3600).toFixed(1)+' h':(x/86400).toFixed(1)+' '+t('jours','days');$('bo').innerHTML=t('Sans protection : 10 000 combinaisons testées en ','No protection: 10,000 combinations tried in ')+'<span class="df">&lt; 1 s</span><br>'+t('Avec blocage progressif (plafond 5 min) : ','With progressive lockout (5 min cap): ')+'<span class="df">≈ '+f(s)+'</span>';return}
  if(k===undefined)return;const now=Date.now();if(now<lockEnd){$('pf').innerHTML=`<span class="bad">${t('Bloqué encore','Locked for')} ${Math.ceil((lockEnd-now)/1000)} s</span>`;return}
  if(k==='C'){pin='';return dots()}if(k==='⏎'){if(pin.length<4)return;const ok=await sha('demo-salt:'+pin)===PINH;pin='';dots();if(ok){tries=locks=0;$('pf').innerHTML=`<span class="ok">✓ ${t('Accès autorisé','Access granted')}</span>`}else{tries++;if(tries>=3){locks++;tries=0;lockEnd=Date.now()+lockSec(locks)*1000;$('pf').innerHTML=`<span class="bad">✗ ${t('Trop d’erreurs : blocage de','Too many errors: locked for')} ${lockSec(locks)} s</span>`}else $('pf').innerHTML=`<span class="bad">✗ ${t('Code incorrect','Wrong PIN')} (${tries}/3)</span>`}return}
  if(pin.length<4){pin+=k;dots()}}}
/* 3 hash */
function lab2(){$('l2').innerHTML=`<h2>${t('Hachage SHA-256 et effet avalanche','SHA-256 hashing and avalanche effect')}</h2><p class="i">${t('Changer un seul caractère modifie complètement l’empreinte.','Changing a single character completely changes the digest.')}</p><div class="g2"><div><label>${t('MESSAGE A','MESSAGE A')}</label><input id="ha" value="Bonjour CyberArt"></div><div><label>${t('MESSAGE B','MESSAGE B')}</label><input id="hb" value="Bonjour CyberArt."></div></div><div class="g2"><div class="out" id="oa"></div><div class="out" id="ob"></div></div><p class="fb" id="hd"></p>`;
 const run=async()=>{const a=await sha($('ha').value),b=await sha($('hb').value);let bits=0;for(let i=0;i<64;i++)bits+=(parseInt(a[i],16)^parseInt(b[i],16)).toString(2).replace(/0/g,'').length;$('oa').innerHTML=[...a].map((c,i)=>c===b[i]?c:`<span class="df">${c}</span>`).join('');$('ob').innerHTML=[...b].map((c,i)=>c===a[i]?c:`<span class="df">${c}</span>`).join('');$('hd').textContent=`${bits}/256 ${t('bits différents (≈ 50 % attendu)','bits differ (≈ 50% expected)')}`};
 $('l2').oninput=run;run()}
/* 4 AES */
async function key(pw,salt,use){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,[use])}
function lab3(){$('l3').innerHTML=`<h2>${t('Chiffrement symétrique AES-GCM','AES-GCM symmetric encryption')}</h2><p class="i">${t('Une clé AES-256 est dérivée du mot de passe (PBKDF2, 100 000 itérations). GCM authentifie aussi le message.','An AES-256 key is derived from the password (PBKDF2, 100,000 iterations). GCM also authenticates the message.')}</p><div class="g2"><div><label>${t('MOT DE PASSE','PASSWORD')}</label><input id="ap" value="secret-demo"><label>${t('MESSAGE','MESSAGE')}</label><textarea id="am" rows="3">${t('Rendez-vous à 18 h.','Meet at 6 pm.')}</textarea><div class="opt"><button class="btn p" id="ae">${t('Chiffrer','Encrypt')}</button></div></div><div><label>${t('TEXTE CHIFFRÉ (base64)','CIPHERTEXT (base64)')}</label><textarea id="ac" rows="3"></textarea><div class="opt"><button class="btn" id="ad">${t('Déchiffrer','Decrypt')}</button></div></div></div><div class="out" id="ao"></div>`;
 $('ae').onclick=async()=>{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key($('ap').value,salt,'encrypt'),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode($('am').value)));const all=new Uint8Array(28+ct.length);all.set(salt);all.set(iv,16);all.set(ct,28);$('ac').value=b64(all);$('ao').innerHTML=`<span class="ok">✓ ${t('Chiffré','Encrypted')}</span> — ${t('sel + IV + données','salt + IV + data')} : ${all.length} ${t('octets','bytes')}`};
 $('ad').onclick=async()=>{try{const a=ub64($('ac').value.trim()),k=await key($('ap').value,a.slice(0,16),'decrypt');$('ao').innerHTML=`<span class="ok">✓ ${t('Déchiffré','Decrypted')} :</span> ${esc(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(16,28)},k,a.slice(28))))}`}catch(e){$('ao').innerHTML=`<span class="bad">✗ ${t('Échec : mot de passe incorrect ou données modifiées (authentification GCM).','Failed: wrong password or tampered data (GCM authentication).')}</span>`}}}
/* 5 RSA */
let kp=null;
function lab4(){$('l4').innerHTML=`<h2>${t('Chiffrement asymétrique RSA-OAEP','RSA-OAEP asymmetric encryption')}</h2><p class="i">${t('La clé publique chiffre, seule la clé privée déchiffre.','The public key encrypts; only the private key decrypts.')}</p><button class="btn p" id="rg">${t('Générer une paire de clés 2048 bits','Generate a 2048-bit key pair')}</button><div class="out" id="rk">${t('Aucune clé générée.','No key generated.')}</div><label>${t('MESSAGE (court)','MESSAGE (short)')}</label><input id="rm" value="Bonjour"><div class="opt"><button class="btn" id="re">${t('Chiffrer avec la clé publique','Encrypt with public key')}</button><button class="btn" id="rd">${t('Déchiffrer avec la clé privée','Decrypt with private key')}</button></div><div class="out" id="ro"></div>`;
 let ct=null;$('rg').onclick=async()=>{$('rk').textContent='…';kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const j=await crypto.subtle.exportKey('jwk',kp.publicKey);$('rk').innerHTML=`<span class="ok">✓</span> ${t('Clé publique (n, tronquée)','Public key (n, truncated)')} : ${j.n.slice(0,60)}… · e=${j.e}`};
 $('re').onclick=async()=>{if(!kp)return $('ro').innerHTML=`<span class="bad">${t('Générez d’abord une paire de clés.','Generate a key pair first.')}</span>`;ct=await crypto.subtle.encrypt({name:'RSA-OAEP'},kp.publicKey,enc.encode($('rm').value));$('ro').textContent=b64(ct)};
 $('rd').onclick=async()=>{if(!ct)return $('ro').innerHTML=`<span class="bad">${t('Chiffrez d’abord un message.','Encrypt a message first.')}</span>`;$('ro').innerHTML=`<span class="ok">✓ ${t('Déchiffré','Decrypted')} :</span> ${esc(dec.decode(await crypto.subtle.decrypt({name:'RSA-OAEP'},kp.privateKey,ct)))}`}}
/* 6 TLS */
const TLS=[['ClientHello','Le navigateur propose ses versions TLS, suites de chiffrement et une valeur aléatoire.','The browser offers its TLS versions, cipher suites and a random value.'],['ServerHello + certificat','Le serveur choisit les paramètres et envoie son certificat.','The server picks the parameters and sends its certificate.'],['Vérification du certificat','Le navigateur valide la chaîne de confiance, le nom de domaine et la date.','The browser validates the trust chain, domain name and dates.'],['Échange de clés (ECDHE)','Les deux parties calculent un secret partagé sans jamais l’envoyer.','Both sides compute a shared secret without ever sending it.'],['Clés de session','Des clés symétriques sont dérivées du secret partagé.','Symmetric keys are derived from the shared secret.'],['Trafic chiffré (AES-GCM)','HTTP circule désormais chiffré et authentifié.','HTTP now flows encrypted and authenticated.']];
let ts=0;
function lab5(){$('l5').innerHTML=`<h2>${t('Poignée de main HTTPS/TLS','HTTPS/TLS handshake')}</h2><p class="i">${t('Étapes simplifiées de TLS 1.3.','Simplified TLS 1.3 steps.')}</p>`+TLS.map((s,i)=>`<div class="step ${i<=ts?'on':''}"><b>${i+1}. ${s[0]}</b><br>${t(s[1],s[2])}</div>`).join('')+`<div class="opt"><button class="btn p" id="tn">${ts<TLS.length-1?t('Étape suivante','Next step'):t('Recommencer','Restart')}</button></div>`;$('tn').onclick=()=>{ts=ts<TLS.length-1?ts+1:0;lab5()}}
function render(){show();lab0();lab1();lab2();lab3();lab4();lab5()}

applyLang();
</script></body></html>
